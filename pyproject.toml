[tool.mypy]
python_version = "3.14"
pretty = true
show_error_codes = true
show_error_context = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = false

[[tool.mypy.overrides]]
module = "kombu.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "click_didyoumean.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asgiref.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dateutil.*"
ignore_missing_imports = true

# Optional extras and stub-less third-party packages.
[[tool.mypy.overrides]]
module = [
    "click_plugins.*",
    "django.*",
    "objgraph.*",
    "psutil.*",
    "pygments.*",
    "tblib.*",
]
ignore_missing_imports = true

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
addopts = "--cov=celery --cov=kombu --cov-report=term-missing --cov-report=xml --no-cov-on-fail"
testpaths = ["tests/unit", "tests/kombu/unit"]
# celery's suite uses `test_*` class names; kombu's carries upstream kombu's
# `test_Thing` convention alongside plain `Test*`. Both are collected.
python_classes = ["Test*", "test_*"]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "celery",
  "sleepdeprived_patched_module",
  "masked_modules",
  "patched_environ",
  "patched_module",
  "flaky",
  "timeout",
  "amqp",
  "unit: marks tests as unit tests",
  "integration: marks tests as integration tests",
]

[tool.coverage.run]
branch = true
source = ["celery", "kombu"]
omit = ["*/__init__.py"]

[tool.coverage.report]
precision = 2
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "except ImportError:",
  "raise NotImplementedError",
]
