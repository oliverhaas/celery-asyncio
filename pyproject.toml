[project]
name = "celery-asyncio"
version = "6.0.0a5"
description = "Distributed Task Queue with native asyncio support"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.14"
keywords = [
  "actors",
  "amqp",
  "async",
  "asyncio",
  "distributed",
  "job",
  "python",
  "queue",
  "rabbitmq",
  "redis",
  "task",
  "valkey",
]
authors = [{ name = "Oliver Haas", email = "ohaas@e1plus.de" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Framework :: Celery",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Object Brokering",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
dependencies = [
  "asgiref>=3.8.0",
  "click>=8.1.2,<9.0",
  "click-didyoumean>=0.3.0",
  "click-plugins>=1.1.1",
  "python-dateutil>=2.8.2",
  "tzlocal",
]

[project.urls]
Homepage = "https://oliverhaas.github.io/celery-asyncio/"
Documentation = "https://oliverhaas.github.io/celery-asyncio/"
Repository = "https://github.com/oliverhaas/celery-asyncio"
Source = "https://github.com/oliverhaas/celery-asyncio"

[project.scripts]
celery = "celery.__main__:main"

[project.optional-dependencies]
# Serializers
msgpack = ["msgpack"]
yaml = ["PyYAML>=3.10"]

# Transports and Backends
valkey = ["valkey>=6.1.0"]
redis = ["redis>=7.1.0"]
# 9.5 is the floor CI runs against; nothing verifies the 9.0-9.4 aiormq/pamqp line.
amqp = ["aio-pika>=9.5.0"]
# Optimized C parsers
hiredis = ["redis[hiredis]>=7.1.0"]
libvalkey = ["valkey[libvalkey]>=6.1.0"]

# Testing
tblib = ["tblib>=1.3.0"]
pytest = ["pytest>=8.0.0"]

# Django
django = ["Django>=6.0"]

# Scheduling
solar = ["ephem"]

# Monitoring. Flower's own dependencies, minus flower itself: flower requires
# upstream "celery" from PyPI, which installs over the celery package this
# distribution provides. Install flower alongside this extra with --no-deps:
#   pip install "celery-asyncio[flower]" && pip install flower --no-deps
flower = ["tornado>=5,<7", "prometheus-client>=0.8", "humanize", "pytz"]

# Compression. zstd needs no extra: PEP 784 put it in the stdlib as of 3.14.
brotli = ["brotli>=1.0.0"]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pre-commit==4.6.2",
  # tests/unit/app/test_app.py importorskips pydantic at module level, so
  # without it the whole module goes quiet, not just the pydantic tests.
  "pydantic==2.13.5",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pytest-mock==3.15.1",
  "pytest-timeout==2.4.0",
  "pytest-xdist==3.8.0",
  "pytest-flakefinder==1.1.0",
  # tests/integration/test_native_delayed_delivery_binding.py reads RabbitMQ's
  # management API over HTTP.
  "requests==2.34.2",
  # Optional-extra packages: installed so the transports, serializers and
  # optional runtime helpers they carry are both type-checked and exercised by
  # the suite instead of skipped. ephem covers the solar schedules in
  # tests/unit/app/test_schedules.py, tblib the remote-traceback path in
  # tests/unit/tasks/test_result.py.
  "aio-pika==9.5.7",
  "brotli==1.2.0",
  "ephem==4.2.1",
  "msgpack==1.2.2",
  "pyyaml==6.0.3",
  "redis==8.1.0",
  "ruff==0.16.5",
  "tblib==3.2.2",
  "valkey==6.1.1",
  "ty==0.0.77",
]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.7",
  "mike==2.2.0",
  "mkdocstrings-python>=2.0.3",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["celery", "kombu"]

[tool.hatch.build.targets.sdist]
include = ["/celery", "/kombu", "/tests", "/LICENSE", "/README.md"]

[tool.ruff]
line-length = 120
target-version = "py314"
fix = true
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "A001",     # Variable shadows a builtin: celery uses type, format, id
  "A002",     # Argument shadows a builtin: same, in public signatures
  "A004",     # Import shadows a builtin
  "ANN",      # Type annotations: nearly all hits inherited from upstream Celery. mypy gates the package instead.
  "ARG002",   # Unused method argument: signal handlers, overrides, API compat
  "ASYNC109", # timeout param is task TTL, not asyncio.timeout
  "BLE001",   # Blind except: needed for task error handling
  "C901",     # Complex structure: some task functions are inherently complex
  "COM812",   # Conflicts with ruff-format
  "CPY001",   # Copyright notice per file. The LICENSE file covers the package.
  "D",        # Docstrings: nearly all hits inherited from upstream Celery
  "E501",     # Line length handled by config
  "EM",       # Exception strings inline are fine
  "FBT",      # Boolean params match task APIs (ignore_result, bind, etc.)
  "FIX002",   # TODO comments: inherited from upstream Celery
  "N801",     # Class naming: celery has its own patterns, e.g. test_Thing
  "N802",     # Function naming: celery has its own patterns
  "N803",     # Argument naming: celery has its own patterns
  "N806",     # Variable naming: celery has its own patterns
  "N812",     # Import alias casing: celery has its own patterns
  "N818",     # Exception names without an Error suffix, as upstream named them
  "PERF203",  # try/except inside a loop: the broker retry loops need it
  "PLC0415",  # Dynamic imports for optional dependencies
  "PLR0912",  # Too many branches: complex task routing logic
  "PLR0913",  # Too many args: task APIs need many options
  "PLR0917",  # Too many positional args, same reason as PLR0913 above
  "PLR1704",  # Redefining argument from local: context manager patterns
  "PLR2004",  # Magic values: task-specific constants
  "PLW0603",  # Global statement: needed for module-level state
  "PLW1641",  # eq without hash
  "PLW2901",  # Redefining loop variable
  "PYI024",   # collections.namedtuple: existing patterns
  "PYI034",   # Non-self return type: __aenter__ patterns
  "PYI036",   # Bad exit annotation: __aexit__ patterns
  "RUF005",   # Tuple concatenation is clearer
  "RUF012",   # Mutable class defaults: intentional for celery state
  "RUF059",   # Unused unpacked variable
  "S110",     # try/except/pass: best-effort cleanup that must not mask the real error
  "SIM105",   # contextlib.suppress: the explicit try/except reads better here
  "SIM108",   # Ternary instead of if/else: style preference
  "SIM212",   # Operand order in a ternary: style preference
  "SLF001",   # Private member access needed for internals
  "TC003",    # Typing-only stdlib import: style preference
  "TD002",    # TODO without an author: inherited from upstream Celery
  "TD003",    # TODO without an issue link: inherited from upstream Celery
  "TRY003",   # Long messages outside the exception class
  "TRY300",   # return in try rather than else
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
suppress-none-returning = true

[tool.ruff.lint.per-file-ignores]
# Inherited from upstream Celery. Branch 2 burns this list down; every entry
# removed here is a rule celery/ now passes cleanly.
"celery/**" = [
  "A",        # Builtin shadowing: celery uses type, format, id as params
  "ARG",      # Unused arguments: signal handlers, overrides, API compat
  "ASYNC110", # asyncio.Event suggestion: not always appropriate
  "B007",     # Unused loop control variable: sometimes intentional
  "B018",     # Useless expression: intentional in some celery patterns
  "B020",     # Loop variable overrides iterator
  "B024",     # Abstract base class without abstract method
  "B026",     # Star-arg unpacking after keyword arg
  "B027",     # Empty method without abstract decorator
  "COM818",   # Trailing comma on bare tuple
  "DTZ",      # Datetime timezone: celery uses naive datetimes throughout
  "E402",     # Module-level import not at top: lazy imports
  "E741",     # Ambiguous variable name: l, O, I used in celery
  "ERA001",   # Commented-out code. Every remaining hit is prose: an exploit
  # illustration, an issue write-up, or shorthand like "chord([A, B], C)"
  "EXE",  # Shebang: examples have shebangs for convenience
  "FIX",  # TODO/FIXME/XXX comments: inherited from upstream Celery
  "G",    # Logging format: celery uses % formatting in logging
  "I001", # Import sorting: kombu became first-party when it moved into this repo,
  # so 40 celery modules have mis-grouped import blocks. Branch 2 fixes them.
  "INP001",  # Implicit namespace package: examples are standalone scripts
  "ISC002",  # Implicit string concatenation
  "N",       # Naming conventions: celery has its own patterns
  "PERF",    # Performance suggestions: readability over micro-optimization
  "PGH003",  # Blanket type-ignore
  "PGH004",  # Blanket noqa
  "PLC0205", # __slots__ style
  "PLE0704", # Misplaced bare raise
  "PLR0206", # Property with parameters
  "PLR0911", # Too many return statements
  "PLR0915", # Too many statements: complex functions
  "PLR1714", # Consider merging comparisons
  "PLW0127", # Self-assigning variable: protocol v1 destructuring
  "PLW1508", # Invalid envvar default
  "PTH",     # Pathlib: celery uses os.path extensively
  "RET503",  # Missing explicit return
  "RET504",  # Unnecessary variable before return
  "RET505",  # Superfluous else return: style preference
  "RSE102",  # Unnecessary parentheses on raise
  "RUF002",  # Ambiguous unicode in docstrings
  "RUF003",  # Ambiguous unicode
  "RUF006",  # asyncio.create_task without reference
  "RUF013",  # Implicit Optional
  "RUF015",  # Readability over micro-optimization
  "RUF022",  # __all__ not sorted
  "RUF046",  # Unnecessary cast
  "S",       # Security: celery needs pickle, subprocess, exec, etc.
  "SIM",     # Simplify: style preference, readability varies
  "SLOT000", # No __slots__ in str subclass
  "T201",    # Print: the CLI banner, worker status output, and the example
  # scripts all write to stdout on purpose
  "TC",     # Typing-only imports: style preference
  "TD",     # TODO comment formatting: inherited from upstream Celery
  "TID252", # Relative imports
  "TRY",    # tryceratops: style preference throughout
  "UP007",  # Non-PEP 604 annotation
  "UP031",  # Printf-style formatting: keep for consistency
  "UP041",  # Timeout error alias
]
