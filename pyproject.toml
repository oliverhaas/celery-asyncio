[project]
name = "celery-asyncio"
version = "6.0.0a5"
description = "Distributed Task Queue with native asyncio support"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.14"
keywords = [
  "actors",
  "amqp",
  "async",
  "asyncio",
  "distributed",
  "job",
  "python",
  "queue",
  "rabbitmq",
  "redis",
  "task",
  "valkey",
]
authors = [{ name = "Oliver Haas", email = "ohaas@e1plus.de" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Framework :: Celery",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Object Brokering",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
dependencies = [
  "asgiref>=3.8.0",
  "click>=8.1.2,<9.0",
  "click-didyoumean>=0.3.0",
  "click-plugins>=1.1.1",
  "python-dateutil>=2.8.2",
  "tzlocal",
]

[project.urls]
Homepage = "https://oliverhaas.github.io/celery-asyncio/"
Documentation = "https://oliverhaas.github.io/celery-asyncio/"
Repository = "https://github.com/oliverhaas/celery-asyncio"
Source = "https://github.com/oliverhaas/celery-asyncio"

[project.scripts]
celery = "celery.__main__:main"

[project.optional-dependencies]
# Serializers
msgpack = ["msgpack"]
yaml = ["PyYAML>=3.10"]

# Transports and Backends
valkey = ["valkey>=6.1.0"]
redis = ["redis>=7.1.0"]
amqp = ["aio-pika>=9.0.0"]
# Optimized C parsers
hiredis = ["redis[hiredis]>=7.1.0"]
libvalkey = ["valkey[libvalkey]>=6.1.0"]

# Testing
tblib = ["tblib>=1.3.0"]
pytest = ["pytest>=8.0.0"]

# Django
django = ["Django>=6.0"]

# Scheduling
solar = ["ephem"]

# Monitoring
flower =["flower>=2.0", "tornado>=5,<7", "prometheus-client>=0.8", "humanize", "pytz"]

# Compression
brotli = ["brotli>=1.0.0"]
zstd = ["zstandard>=0.22.0"]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pre-commit==4.6.2",
  # tests/unit/app/test_app.py importorskips pydantic at module level, so
  # without it the whole module -- not just the pydantic tests -- goes quiet.
  "pydantic==2.13.5",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pytest-mock==3.15.1",
  "pytest-timeout==2.4.0",
  "pytest-xdist==3.8.0",
  "pytest-flakefinder==1.1.0",
  "redis==8.1.0",
  "ruff==0.16.5",
  "valkey==6.1.1",
  "ty==0.0.75",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "mike==2.2.0",
    "mkdocstrings-python>=2.0.3",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["celery", "kombu"]

[tool.hatch.build.targets.sdist]
include = ["/celery", "/kombu", "/tests", "/LICENSE", "/README.md"]

[tool.uv]
# flower depends on "celery" (PyPI), but celery-asyncio provides the celery
# Python module. This override prevents uv from pulling in upstream celery.
override-dependencies = ["celery ; python_version < '0'"]

[tool.ruff]
line-length = 120
target-version = "py314"
fix = true
extend-exclude = ["*.md"]

