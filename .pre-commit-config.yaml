default_stages: [pre-commit]
default_install_hook_types:
  - pre-commit
  - pre-push
fail_fast: false

default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      # Formatting only. --reorder-keys and --reorder-arrays rewrite the file's
      # meaning-bearing order (dependency groups, the ruff ignore lists) and are
      # not something a format hook should decide.
      - id: taplo-format
        args: ["--", "--indent-string", "  "]

  - repo: local
    hooks:
      - id: uv-sync-check
        name: uv-sync-check
        language: system
        entry: uv sync
        pass_filenames: false
      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check --fix
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        entry: uv run mypy celery/ kombu/
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # ty is pre-1.0 and still reports several hundred findings against the
      # modules inherited from upstream Celery, so for celery/ it only gates
      # the modules written from scratch for this fork. All of kombu/ is gated.
      - id: ty
        name: ty
        language: system
        entry: uv run ty check kombu/ celery/concurrency/aio.py celery/utils/promises.py celery/utils/scheduling.py celery/worker/loops.py
        pass_filenames: false
        always_run: true
        stages: [pre-push]
