name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ruff check
        run: uv run ruff check --no-fix

      - name: Run ruff format check
        run: uv run ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run mypy
        run: uv run mypy celery/ kombu/

      # ty is pre-1.0 and still reports several hundred findings against the
      # modules inherited from upstream Celery, so for celery/ it only gates
      # the modules written from scratch for this fork. All of kombu/ is gated.
      - name: Run ty
        run: uv run ty check kombu/ celery/concurrency/aio.py celery/utils/promises.py celery/utils/scheduling.py celery/worker/loops.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}

      # A free-threaded build re-enables the GIL for the whole process the
      # moment it imports an extension that has not declared free-threading
      # support. _brotli (pulled in by kombu's compression registry and by
      # requests) and ephem._libastro both do, so without PYTHON_GIL=0 the
      # 3.14t job runs with the GIL back on and proves nothing. The variable is
      # empty on 3.14, where the build rejects PYTHON_GIL=0 outright.
      - name: Run tests
        env:
          PYTHON_GIL: ${{ matrix.python-version == '3.14t' && '0' || '' }}
        run: uv run --python ${{ matrix.python-version }} pytest -p no:xdist

      - name: Upload coverage
        if: always() && matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  integration:
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run kombu integration tests
        run: uv run pytest tests/kombu/integration/ -q --no-cov

      # Serially this suite takes hours, so it runs on six workers, each on a
      # Redis database of its own (see tests/integration/conftest.py). The
      # global_pubsub tests are the ones that isolation cannot help, because
      # Redis reports PUBSUB channels per server rather than per database; they
      # get a serial step below.
      # --timeout because the pytest config sets none, and a hung task would
      # otherwise hang the job. It is a guard against hangs, not a performance
      # budget: several of these tests wait out deliberate timeouts to prove a
      # task did *not* run, which puts them over two minutes on their own. 300s
      # is also what the suite's own `flaky` decorator already gives the tests
      # it wraps, so this makes the budget uniform.
      - name: Run celery integration tests
        timeout-minutes: 45
        run: uv run pytest tests/integration/ -q --no-cov --timeout=300 -n 6 -m "not global_pubsub"

      - name: Run celery integration tests that need the broker to themselves
        timeout-minutes: 15
        run: uv run pytest tests/integration/ -q --no-cov --timeout=300 -m global_pubsub

      # The steps above run against Valkey, which left the AMQP transport with
      # no worker running against it anywhere in CI, and the tests marked
      # `amqp` skipped on every broker the suite used. A worker died on its
      # first prefetch change and nothing noticed. Serial: the xdist workers
      # divide up Redis databases, and there is no such division of one vhost.
      - name: Run celery integration tests against RabbitMQ
        timeout-minutes: 20
        env:
          TEST_BROKER: amqp://guest:guest@localhost:5672//
        run: >-
          uv run pytest
          tests/integration/test_tasks.py
          tests/integration/test_quorum_queue_qos_cluster_simulation.py
          tests/integration/test_rabbitmq_chord_unlock_routing.py
          -q --no-cov --timeout=300 -p no:xdist
